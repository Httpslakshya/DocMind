<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DocMind turns PDFs into cited answers, notes, quizzes, and study guides." />
  <title>DocMind | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#1c1b1b',
            paper: '#fcf9f8',
            card: '#ffffff',
            yellow: '#ffd60a',
            yellowSoft: '#ffe171',
            purple: '#645efb',
            purpleDark: '#4b41e1',
            muted: '#4d4632',
            line: '#1c1b1b',
            danger: '#ba1a1a',
            dangerSoft: '#ffdad6'
          },
          fontFamily: { display: ['Space Grotesk', 'sans-serif'], body: ['Space Grotesk', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Space Grotesk', sans-serif; }
    .shadow-brutal { box-shadow: 8px 8px 0 #1c1b1b; }
    .shadow-brutal-lg { box-shadow: 14px 14px 0 #1c1b1b; }
    .press { transition: transform .16s ease, box-shadow .16s ease, background .16s ease; }
    .press:hover { transform: translate(-3px, -3px); box-shadow: 11px 11px 0 #1c1b1b; }
    .press:active { transform: translate(5px, 5px); box-shadow: 3px 3px 0 #1c1b1b; }
    .field:focus { outline: none; background: #fff8b7; box-shadow: 6px 6px 0 #1c1b1b; transform: translate(-2px, -2px); }
    @keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .pop { animation: pop .35s ease both; }
  </style>
</head>
<body class="min-h-screen bg-paper text-ink selection:bg-yellow selection:text-ink">
  <main class="min-h-screen grid lg:grid-cols-[1.05fr_.95fr]">
    <section class="hidden lg:flex relative overflow-hidden bg-yellow border-r-4 border-line p-12 items-center justify-center">
      <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#1c1b1b 2px, transparent 2px); background-size: 30px 30px;"></div>
      <div class="absolute top-10 left-10 h-20 w-20 rounded-full bg-purple border-4 border-line shadow-brutal"></div>
      <div class="absolute bottom-12 right-16 h-28 w-28 bg-card border-4 border-line shadow-brutal rotate-6"></div>
      <div class="relative z-10 max-w-xl pop">
        <div class="mb-8 inline-flex items-center gap-4 bg-card border-4 border-line shadow-brutal px-5 py-4">
          <div class="h-16 w-16 rounded-full border-4 border-line bg-yellow overflow-hidden shadow-[4px_4px_0_#1c1b1b]">
            <img src="/static/docmind-logo.png" alt="DocMind logo" class="h-full w-full object-cover" />
          </div>
          <div>
            <p class="text-sm font-black uppercase tracking-[.18em] text-muted">Meet</p>
            <h1 class="text-4xl font-black leading-none">DocMind</h1>
          </div>
        </div>
        <h2 class="text-5xl xl:text-6xl font-black leading-[.98] tracking-tight">Chat with PDFs and land on the exact page.</h2>
        <p class="mt-6 text-xl font-semibold text-muted max-w-lg">A handcrafted document workspace for cited answers, notes, quizzes, and study guides.</p>
      </div>
    </section>

    <section class="flex items-center justify-center p-5 sm:p-8">
      <div class="w-full max-w-md pop">
        <div class="lg:hidden mb-8 flex items-center gap-3">
          <div class="h-12 w-12 rounded-full border-4 border-line bg-yellow overflow-hidden shadow-[4px_4px_0_#1c1b1b]">
            <img src="/static/docmind-logo.png" alt="DocMind logo" class="h-full w-full object-cover" />
          </div>
          <strong class="text-3xl font-black">DocMind</strong>
        </div>

        <div class="bg-card border-4 border-line shadow-brutal-lg p-6 sm:p-8">
          <p class="inline-block bg-yellow border-4 border-line px-3 py-1 text-xs font-black uppercase tracking-[.16em]">Demo Access</p>
          <h2 class="mt-5 text-4xl font-black tracking-tight">Welcome back</h2>
          <p class="mt-2 text-muted font-semibold">Use any email and password to enter your workspace.</p>

          <form id="login-form" class="mt-7 space-y-4" novalidate>
            <div>
              <label for="email" class="block text-sm font-black uppercase tracking-wide mb-2">Email</label>
              <input id="email" name="email" type="email" required placeholder="you@example.com" class="field w-full rounded-none border-4 border-line bg-paper p-4 font-bold transition" />
            </div>
            <div>
              <label for="password" class="block text-sm font-black uppercase tracking-wide mb-2">Password</label>
              <input id="password" name="password" type="password" required placeholder="password" class="field w-full rounded-none border-4 border-line bg-paper p-4 font-bold transition" />
            </div>
            <div class="flex items-center justify-between gap-3 text-sm font-bold">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="rounded-none border-4 border-line text-purple focus:ring-0" />
                Remember me
              </label>
              <button type="button" id="forgot-btn" class="text-purple hover:underline underline-offset-4 font-black">Forgot password?</button>
            </div>
            <button id="signin-btn" type="submit" class="press shadow-brutal w-full bg-purple text-white border-4 border-line p-4 font-black uppercase text-lg flex items-center justify-center gap-2">
              <span>Sign In</span>
              <span class="material-symbols-outlined">arrow_forward</span>
            </button>
          </form>

          <div class="my-7 flex items-center gap-3">
            <div class="h-1 flex-1 bg-ink"></div>
            <span class="font-black text-xs uppercase tracking-[.16em]">or</span>
            <div class="h-1 flex-1 bg-ink"></div>
          </div>

          <button id="google-login-btn" type="button" class="press shadow-brutal w-full bg-card border-4 border-line p-4 font-black uppercase text-lg flex items-center justify-center gap-3">
            <span class="material-symbols-outlined text-purple">account_circle</span>
            Continue as Guest
          </button>
          <p class="mt-6 text-center text-muted font-semibold">No account? <button id="signup-btn" class="font-black text-purple hover:underline underline-offset-4">Start with demo access</button></p>
          <p id="login-status" class="mt-4 hidden border-4 border-line bg-dangerSoft p-3 font-bold text-danger"></p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById('login-status');
    const form = document.getElementById('login-form');

    function setStatus(message, isError = true) {
      statusEl.textContent = message;
      statusEl.classList.remove('hidden', 'bg-dangerSoft', 'text-danger', 'bg-yellow');
      statusEl.classList.add(isError ? 'bg-dangerSoft' : 'bg-yellow', isError ? 'text-danger' : 'text-ink');
    }

    async function login(email, password) {
      const formData = new FormData();
      formData.append('email', email);
      formData.append('password', password);
      const btn = document.getElementById('signin-btn');
      btn.disabled = true;
      btn.querySelector('span').textContent = 'Signing In...';
      try {
        const res = await fetch('/api/login', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok || data.status !== 'success') throw new Error(data.detail || 'Login failed');
        window.location.href = data.redirect;
      } catch (err) {
        setStatus(err.message);
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Sign In';
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) {
        setStatus('Add an email and password to continue.');
        return;
      }
      login(email, password);
    });

    document.getElementById('google-login-btn').addEventListener('click', () => login('guest@docmind.local', 'demo-access'));
    document.getElementById('signup-btn').addEventListener('click', () => login('new-user@docmind.local', 'demo-access'));
    document.getElementById('forgot-btn').addEventListener('click', () => setStatus('Demo mode accepts any email and password. Try signing in directly.', false));
  </script>
</body>
</html>
